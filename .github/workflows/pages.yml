name: Deploy Mycelium prototype

on:
  push:
    branches:
      - prototype/mycelium-demo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Expand static prototype
        shell: bash
        run: |
          set -euo pipefail
          cat prototype-bundle/site-*.b64 | base64 --decode > /tmp/mycelium-site.tar.gz
          mkdir site
          tar -xzf /tmp/mycelium-site.tar.gz -C site
          test -f site/index.html
          test -f site/demo.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      statuses: write
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy
        if: needs.build.result == 'success'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify live endpoints
        if: steps.deployment.outcome == 'success'
        id: verify
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}/"

          for attempt in $(seq 1 12); do
            index_html="$(curl --fail --silent --show-error --location --max-time 20 "${base_url}" || true)"
            demo_html="$(curl --fail --silent --show-error --location --max-time 20 "${base_url}demo.html" || true)"

            if grep -Fq '<title>Mycelium | Organizational memory for software teams</title>' <<<"${index_html}" \
              && grep -Fq '<title>Mycelium Console | Interactive prototype</title>' <<<"${demo_html}"; then
              exit 0
            fi

            sleep 5
          done

          echo "Pages deployed, but the expected HTML was not reachable." >&2
          exit 1

      - name: Publish live verification status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail

          state=failure
          description='Pages endpoint verification failed'
          if [ "${VERIFY_OUTCOME}" = 'success' ]; then
            state=success
            description='Pages endpoints are live'
          fi

          printf -v payload \
            '{"state":"%s","context":"pages/live","description":"%s","target_url":"https://github.com/%s/actions/runs/%s"}' \
            "${state}" "${description}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"
